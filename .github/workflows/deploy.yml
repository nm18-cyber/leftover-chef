# Deploys the site in public/ to Cloudflare Pages on every push to main.
# Needs a repository secret named CLOUDFLARE_API_TOKEN (see README).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip until the Cloudflare token is added
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so nothing was deployed. See README."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 05737ab3826d1e50a5b33685204024fa
          command: pages deploy public --project-name leftover-chef --branch main
